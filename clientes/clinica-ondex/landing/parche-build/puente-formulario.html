    <script>
      /* Puente del formulario -> GoHighLevel.
         Esta pagina se compilo sin envio al CRM: al enviar solo mostraba la
         pantalla de exito y borraba los datos. Este script escucha el envio en
         fase de captura (antes que React), manda el lead a GHL y dispara el
         evento del pixel. React sigue pintando el "Listo!".
         Tambien enlaza el boton "Hablar por WhatsApp", que se compilo sin href.

         OJO: esto es un parche sobre el build. Si el proyecto se vuelve a
         compilar desde el codigo fuente hay que incorporarlo alli (ver
         src/lib/leads.ts de las landings de Metodo y Kinesiologia). */
      (function () {
        "use strict";
        var WEBHOOK = "__WEBHOOK__";
        var ORIGEN = "__ORIGEN__";
        var ORIGEN_NOMBRE = "__ORIGEN_NOMBRE__";
        var WHATSAPP = "56952296611";
        var enviado = false;

        function leerCookie(n) {
          var pre = n + "=", t = document.cookie.split("; ");
          for (var i = 0; i < t.length; i++)
            if (t[i].indexOf(pre) === 0) return decodeURIComponent(t[i].slice(pre.length));
        }
        function nuevoId() {
          try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}
          return "evt-" + Date.now() + "-" + Math.random().toString(36).slice(2, 11);
        }
        /* Meta necesita fbc para atribuirle la conversion al anuncio. La cookie
           _fbc la escribe el pixel, pero puede no existir en el primer pageview:
           si viene fbclid en la URL y la cookie no esta, se arma a mano. */
        function obtenerFbc(p) {
          var c = leerCookie("_fbc"); if (c) return c;
          var id = p.get("fbclid");
          return id ? "fb.1." + Date.now() + "." + id : undefined;
        }
        function normalizar(v) {
          var d = String(v || "").replace(/\D/g, "");
          if (d.indexOf("56") === 0) return "+" + d;
          if (d.length === 9 && d.charAt(0) === "9") return "+56" + d;
          if (d.length === 8) return "+569" + d;
          return "+" + d;
        }
        function val(f, id) {
          var e = (f && f.querySelector("#" + id)) || document.getElementById(id);
          return e && e.value ? e.value.trim() : "";
        }
        function opt(s) { return s ? s : undefined; }

        document.addEventListener("submit", function (ev) {
          var f = ev.target;
          if (!f || f.tagName !== "FORM" || enviado) return;
          var nombre = val(f, "nombre"), whatsapp = val(f, "whatsapp");
          if (!nombre || !whatsapp) return;   /* no es el formulario de contacto */
          enviado = true;

          var p = new URLSearchParams(window.location.search);
          var id = nuevoId();
          var cuerpo = {
            evento: "lead_completo",
            first_name: nombre,
            phone: normalizar(whatsapp),
            zona_dolor: opt(val(f, "dolor")),
            tiempo_dolor: opt(val(f, "tiempo")),
            origen_landing: ORIGEN,
            origen_landing_nombre: ORIGEN_NOMBRE,
            event_id: id,
            utm_source: opt(p.get("utm_source")),
            utm_medium: opt(p.get("utm_medium")),
            utm_campaign: opt(p.get("utm_campaign")),
            utm_content: opt(p.get("utm_content")),
            utm_term: opt(p.get("utm_term")),
            gclid: opt(p.get("gclid")),
            fbclid: opt(p.get("fbclid")),
            fbp: leerCookie("_fbp"),
            fbc: obtenerFbc(p),
            landing_url: window.location.href,
            referrer: document.referrer || undefined
          };
          try {
            fetch(WEBHOOK, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(cuerpo),
              keepalive: true
            })["catch"](function (e) {
              enviado = false;
              console.error("[puente] fallo el envio a GHL:", e);
            });
          } catch (e) { enviado = false; console.error("[puente]", e); }
          if (window.fbq) window.fbq("track", "Lead", {}, { eventID: id });
        }, true);

        /* El boton "Hablar por WhatsApp" se compilo como <button> sin enlace. */
        document.addEventListener("click", function (ev) {
          var el = ev.target;
          for (var i = 0; el && i < 5; i++, el = el.parentElement) {
            if (el.tagName === "A") return;
            if (el.tagName === "BUTTON" && /Hablar por WhatsApp/i.test(el.textContent || "")) {
              ev.preventDefault();
              window.open(
                "https://wa.me/" + WHATSAPP + "?text=" +
                  encodeURIComponent("Hola, quiero informacion sobre una evaluacion."),
                "_blank", "noopener"
              );
              return;
            }
          }
        }, true);
      })();
    </script>
